<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>9hoch9 · ULTRA · QI · IQQ · CUBEMIND</title>

<style>
body {
    background:#000;
    color:#0ff;
    font-family:Consolas;
    padding:30px;
}
h1 { color:#6cf; }
h2 { color:#0f0; margin-top:25px; }
pre {
    background:#111;
    padding:12px;
    border:1px solid #333;
    border-radius:6px;
}
</style>

<script type="module">

import { OSF_VECTOR } from "./OSF.vector";
import { ECO_ROOT_VECTOR } from "./OSF.vector";
import PIµ from "./PI.js";

import { ULTRA_KERNEL } from "./ultra.kernel.js";
import { CXR_ORBIT } from "./cxr.orbit.js";
import { PIPELINE12_MASTER } from "./pipeline12.master.js";
import { CUBE9 } from "./cube9.js";
import { FUSION9 } from "./fusion9.js";

async function start() {

    // QI / IQQ aus PI.js
    const QI  = PIµ.phiScale(PIµ.pi);
    const IQQ = PIµ.muShift(PIµ.vec(1,1));

    // ULTRA 9×9 Kernel
    const matrix = ULTRA_KERNEL.start();

    // Orbit
    const orbit = CXR_ORBIT.start(matrix);

    // Pipeline12
    const pipe12 = PIPELINE12_MASTER.start(matrix);

    // CUBE9 Mind
    const cubeMind = new CUBE9(matrix).mind();

    // Fusion9
    const fusion = new FUSION9(matrix).fusion();

    // OSF Vector
    const osfVector = {
        DIR: OSF_VECTOR.DIR(),
        STABIL: OSF_VECTOR.STABIL(),
        ASCEND: OSF_VECTOR.ASCEND_VECTOR()
    };

    // ECO Root Vector
    const ecoVector = {
        ECO: ECO_ROOT_VECTOR.ECO(),
        ECO9: ECO_ROOT_VECTOR.ECO9(),
        ULTRA: ECO_ROOT_VECTOR.ULTRA()
    };

    document.getElementById("out").innerText =
        JSON.stringify({
            QI,
            IQQ,
            matrix,
            orbit,
            pipe12,
            cubeMind,
            fusion,
            osfVector,
            ecoVector
        }, null, 2);
}

start();

</script>

</head>

<body>

<h1>9hoch9 · ULTRA · QI · IQQ · CUBEMIND</h1>

<h2>Output</h2>
<pre id="out">Lade…</pre>

</body>
</html>
